name: Build SW Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ==============================
      # POBRANIE REPOZYTORIUM
      # ==============================
      - name: Checkout
        uses: actions/checkout@v4

      # ==============================
      # JAVA 17
      # ==============================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==============================
      # ANDROID SDK
      # ==============================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # ==============================
      # SPRAWDZENIE STRUKTURY
      # ==============================
      - name: Check Android project
        run: |
          echo "=== ZAWARTOŚĆ REPOZYTORIUM ==="
          ls -la

          echo "=== SPRAWDZANIE PLIKÓW ==="

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "❌ Brak settings.gradle lub settings.gradle.kts"
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "❌ Brak folderu app/"
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "❌ Brak app/build.gradle lub app/build.gradle.kts"
            exit 1
          fi

          echo "✅ Projekt Android został znaleziony."

      # ==============================
      # GRADLE
      # ==============================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ==============================
      # BUDOWANIE APK
      # ==============================
      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      # ==============================
      # SPRAWDZENIE APK
      # ==============================
      - name: Check APK
        run: |
          echo "=== WYGNEROWANE PLIKI ==="
          find app/build/outputs -type f -name "*.apk" -print

          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "❌ APK nie zostało wygenerowane."
            exit 1
          fi

          echo "✅ APK zostało wygenerowane poprawnie."

      # ==============================
      # UPLOAD APK
      # ==============================
      - name: Upload SW APK
        uses: actions/upload-artifact@v4
        with:
          name: SW-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
